<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TP1 - Budget par image</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; font-size: 18px; }
  .big { font-size: 40px; font-weight: bold; }
  .ok { color: #0a7d2c; }
  .ko { color: #c0392b; }
  input[type=range] { width: 100%; }
</style>
</head>
<body>
<h1>Budget de temps par image</h1>
<p class="big" id="fps">-- images/s</p>
<p>
  Temps moyen par image : <b id="moy">--</b> ms<br>
  Pire image (sur 60) : <b id="pire">--</b> ms<br>
  Cadence nominale estimée de l'écran : <b id="nominal">--</b> Hz<br>
  Budget nominal par image : <b id="budget">--</b> ms
</p>
<p id="verdict"></p>
<h3>Charge artificielle : <span id="valCharge">0</span> ms par image</h3>
<input type="range" id="charge" min="0" max="40" step="1" value="0" disabled>
<p id="info">Calibration en cours... ne touchez pas l'écran (environ 5 secondes).</p>

<script>
const frames = [];     // 60 dernières images (avec la charge actuelle)
const refFrames = [];  // images mesurées SANS charge (pour la cadence nominale)
let derniere = performance.now();
let charge = 0;
let nominal = null;

const slider = document.getElementById('charge');
slider.oninput = e => {
  charge = +e.target.value;
  document.getElementById('valCharge').textContent = charge;
};

function mediane(tab) {
  const s = [...tab].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}

function boucle(t) {
  const dt = t - derniere;
  derniere = t;

  // On ignore le démarrage et les pauses (onglet en arrière-plan)
  if (t > 1500 && dt > 0 && dt < 500) {
    frames.push(dt);
    if (frames.length > 60) frames.shift();
    if (charge === 0) {
      refFrames.push(dt);
      if (refFrames.length > 120) refFrames.shift();
    }
  }

  // Simule un calcul lourd : on occupe le processeur pendant `charge` ms
  const debut = performance.now();
  while (performance.now() - debut < charge) { /* attente active */ }

  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

setInterval(() => {
  // Cadence nominale : médiane des images mesurées sans charge
  if (charge === 0 && refFrames.length >= 40) {
    const fpsRef = 1000 / mediane(refFrames);
    const standards = [30, 60, 72, 90, 120];
    nominal = standards.reduce((p, c) =>
      Math.abs(c - fpsRef) < Math.abs(p - fpsRef) ? c : p);
    if (slider.disabled) {
      slider.disabled = false;
      document.getElementById('info').textContent = '';
    }
  }
  if (nominal === null || frames.length < 10) return;

  const moy = frames.reduce((a, b) => a + b, 0) / frames.length;
  const pire = Math.max(...frames);
  const fps = 1000 / moy;
  const budget = 1000 / nominal;

  document.getElementById('fps').textContent = fps.toFixed(0) + ' images/s';
  document.getElementById('moy').textContent = moy.toFixed(1);
  document.getElementById('pire').textContent = pire.toFixed(1);
  document.getElementById('nominal').textContent = nominal;
  document.getElementById('budget').textContent = budget.toFixed(1);

  const v = document.getElementById('verdict');
  if (moy > budget * 1.15 || pire > budget * 1.5) {
    v.textContent = 'Budget dépassé : saccades visibles.';
    v.className = 'ko';
  } else {
    v.textContent = 'Budget respecté.';
    v.className = 'ok';
  }
}, 500);
</script>
</body>
</html>
